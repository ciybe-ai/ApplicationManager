name: Release

# Wird ausgeloest, sobald ein Tag im Format v1.2.3 gepusht wird:
#   git tag v1.0.0
#   git push origin v1.0.0
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write   # noetig, um ein GitHub Release zu erstellen/Assets hochzuladen

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: .NET 8 SDK einrichten
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Version aus Tag ableiten (v1.2.3 -> 1.2.3)
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: SystemAgent veroeffentlichen
        shell: pwsh
        run: |
          dotnet publish src/SystemAgent `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:Version=${{ steps.version.outputs.version }} `
            -o publish/SystemAgent

      - name: UserAgent veroeffentlichen
        shell: pwsh
        run: |
          dotnet publish src/UserAgent `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:Version=${{ steps.version.outputs.version }} `
            -o publish/UserAgent

      - name: Release-Assets zusammenstellen
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null

          Copy-Item "publish/SystemAgent/ApplicationManager.SystemAgent.exe" "release/ApplicationManager.SystemAgent.exe"
          Copy-Item "publish/SystemAgent/appsettings.json"                 "release/SystemAgent.appsettings.json"

          Copy-Item "publish/UserAgent/ApplicationManager.UserAgent.exe"    "release/ApplicationManager.UserAgent.exe"
          Copy-Item "publish/UserAgent/appsettings.json"                  "release/UserAgent.appsettings.json"

          Copy-Item "scripts/Install.ps1"   "release/Install.ps1"
          Copy-Item "scripts/Uninstall.ps1" "release/Uninstall.ps1"

      - name: SHA256-Hashes berechnen
        id: hashes
        shell: pwsh
        run: |
          $sysHash  = (Get-FileHash "release/ApplicationManager.SystemAgent.exe" -Algorithm SHA256).Hash
          $userHash = (Get-FileHash "release/ApplicationManager.UserAgent.exe" -Algorithm SHA256).Hash
          echo "systemAgentSha256=$sysHash"   >> $env:GITHUB_OUTPUT
          echo "userAgentSha256=$userHash"    >> $env:GITHUB_OUTPUT

      - name: Update-Manifest erzeugen
        shell: pwsh
        env:
          REPO: ${{ github.repository }}
        run: |
          # Feste "latest"-URLs: zeigen IMMER auf das neueste Release,
          # muessen bei kuenftigen Releases nicht angepasst werden.
          $base = "https://github.com/$env:REPO/releases/latest/download"

          $manifest = @{
            version           = "${{ steps.version.outputs.version }}"
            systemAgentUrl    = "$base/ApplicationManager.SystemAgent.exe"
            systemAgentSha256 = "${{ steps.hashes.outputs.systemAgentSha256 }}"
            userAgentUrl      = "$base/ApplicationManager.UserAgent.exe"
            userAgentSha256   = "${{ steps.hashes.outputs.userAgentSha256 }}"
          }

          $manifest | ConvertTo-Json | Set-Content "release/update-manifest.json" -Encoding utf8

      - name: GitHub Release veroeffentlichen
        uses: softprops/action-gh-release@v2
        with:
          name: "ApplicationManager ${{ steps.version.outputs.version }}"
          generate_release_notes: true
          files: |
            release/ApplicationManager.SystemAgent.exe
            release/ApplicationManager.UserAgent.exe
            release/SystemAgent.appsettings.json
            release/UserAgent.appsettings.json
            release/update-manifest.json
            release/Install.ps1
            release/Uninstall.ps1
